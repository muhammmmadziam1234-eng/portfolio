<!doctype html>
<meta charset="utf-8">
<title>Social preview, 1200 by 630</title>
<!-- Rendered by scripts/share.mjs at 1200 by 630. No query: the site preview. ?p=<slug>: that project's share picture. -->
<style>
@font-face{font-family:Archivo;src:url(../assets/fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#fbfbf9;color:#161d22;font-family:Archivo,Arial,sans-serif;display:grid;grid-template-columns:600px 600px}
.t{box-sizing:border-box;height:630px;padding:64px 56px 64px 72px;display:flex;flex-direction:column}
.t::before{content:"";width:48px;height:6px;background:#0d6e53;margin-bottom:28px;flex:none}
.site{font-size:24px;font-weight:560;font-stretch:108%;letter-spacing:-.005em;color:#55616b;margin:0}
h1{font-weight:660;font-stretch:112%;font-size:68px;line-height:1.04;letter-spacing:-.025em;margin:auto 0 0;overflow-wrap:break-word;hyphens:manual;min-height:0}
p{font-size:28px;line-height:1.38;color:#55616b;margin:24px 0 0;max-width:26ch}
.img{background:#232c33 center/cover no-repeat}
.img img{display:block;width:100%;height:100%;object-fit:cover}
body.project .t{justify-content:flex-start}
body.project h1{margin-top:auto}
body.project p{margin-bottom:0}
/* projects: the whole 4:3 card picture, framed, so app screenshots are not cut at the sides */
body.project{grid-template-columns:470px 730px}
body.project .t{padding-right:36px}
body.project .img{background:#eef0ec;display:grid;place-items:center}
body.project .img img{width:640px;height:480px;object-fit:cover;border-radius:12px;box-shadow:0 2px 4px rgba(22,29,34,.08),0 18px 40px rgba(22,29,34,.16)}
</style>
<div class="t"><div class="site" id="site"></div><h1 id="h"></h1><p id="p"></p></div>
<div class="img" id="img"></div>
<script type="module">
import site from '../site.config.js';
import {bySlug} from '../assets/js/projects.js';
const slug = new URLSearchParams(location.search).get('p');
const proj = slug && bySlug[slug];
const $ = id => document.getElementById(id);
let src;
if (proj) {
  document.body.classList.add('project');
  $('site').textContent = site.name;
  $('h').textContent = proj.title;
  $('p').textContent = proj.kind;
  src = '../' + proj.thumb;
} else {
  $('site').remove();
  $('h').textContent = site.name;
  $('h').style.marginTop = '0';
  $('h').style.fontSize = '60px';
  $('h').style.whiteSpace = 'nowrap';
  $('p').textContent = site.role;
  $('p').style.cssText = 'color:#161d22;font-weight:560;font-stretch:108%;font-size:30px;max-width:22ch;margin-top:28px';
  const tag = document.createElement('p');
  tag.textContent = site.tagline;
  tag.style.cssText = 'font-size:25px;max-width:30ch;margin-top:20px';
  $('p').after(tag);
  src = '../assets/media/cirrus-explode/explode-13.jpg';
}
const img = new Image();
img.alt = '';
img.src = src;
if (!proj) { img.style.objectPosition = '62% 50%'; }
$('img').append(img);
// Shrink the heading until the text column fits.
const col = document.querySelector('.t');
await Promise.all([document.fonts.load('660 68px Archivo'), document.fonts.load('560 24px Archivo'), img.decode()]);
await document.fonts.ready;
let size = proj ? 68 : 60;
while ((col.scrollHeight > col.clientHeight || $('h').scrollWidth > $('h').clientWidth) && size > 36) { size -= 2; $('h').style.fontSize = size + 'px'; }
document.body.dataset.ready = '1';
</script>
